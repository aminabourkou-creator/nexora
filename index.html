<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0B0A08"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Nexora Studio</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nexora">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0B0A08;--card:#16130D;--primary:#D4AF37;--secondary:#B08D2B;--accent:#8B6F1F;
  --text:#F5EFDD;--muted:#9C9282;--border:rgba(212,175,55,0.14);--danger:#ef4444;--success:#22c55e;}
html,body{height:100%;overflow:hidden;background:#0B0A08;}
body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#F5EFDD;font-size:14px;line-height:1.5;}
button,input{font-family:inherit;-webkit-appearance:none;}
canvas#bg{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ──────────────────────────── DELETE BUTTONS ──────────────────────────── */
.msg-actions{display:none;position:absolute;right:8px;top:4px;z-index:10;
  gap:4px;background:rgba(17,24,39,.9);border:1px solid rgba(239,68,68,.3);
  border-radius:8px;padding:4px;}
.msg-row:hover .msg-actions{display:flex;}
.btn-del{background:transparent;border:none;color:#fca5a5;font-size:16px;
  cursor:pointer;padding:4px 6px;border-radius:4px;transition:all .2s;
  display:flex;align-items:center;justify-content:center;}
.btn-del:hover{background:rgba(239,68,68,.2);color:#ff6b6b;}
.btn-del:active{transform:scale(.9);}

.friend-actions{display:flex;gap:6px;align-items:center;}
.btn-unfriend{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);
  color:#fca5a5;padding:6px 10px;border-radius:8px;font-size:12px;
  cursor:pointer;transition:all .2s;font-weight:600;}
.btn-unfriend:hover{background:rgba(239,68,68,.25);color:#ff6b6b;}
.btn-unfriend:active{transform:scale(.95);}

.dm-header-actions{display:flex;gap:6px;align-items:center;margin-left:auto;}
.btn-del-dm{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);
  color:#fca5a5;padding:6px 10px;border-radius:8px;font-size:13px;
  cursor:pointer;transition:all .2s;font-weight:600;}
.btn-del-dm:hover{background:rgba(239,68,68,.25);color:#ff6b6b;}

.confirm-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;
  display:none;flex-direction:column;align-items:center;justify-content:center;}
.confirm-modal.show{display:flex;}
.confirm-box{background:var(--card);border:1px solid rgba(212,175,55,.2);
  border-radius:16px;padding:28px;max-width:90vw;width:320px;
  text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.8);}
.confirm-box h3{font-family:'Playfair Display',serif;color:#E8D9A0;
  font-size:18px;margin-bottom:12px;}
.confirm-box p{color:#D8D2C4;font-size:14px;margin-bottom:22px;line-height:1.5;}
.confirm-btns{display:flex;gap:10px;justify-content:center;}
.btn-cancel,.btn-confirm{padding:10px 20px;border-radius:10px;
  border:none;cursor:pointer;font-weight:600;font-size:14px;
  transition:all .2s;}
.btn-cancel{background:rgba(255,255,255,.08);color:#D8D2C4;border:1px solid rgba(255,255,255,.15);}
.btn-cancel:hover{background:rgba(255,255,255,.12);}
.btn-confirm{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3);}
.btn-confirm:hover{background:rgba(239,68,68,.25);}

/* SCREENS */
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  transition:opacity .45s,transform .45s;background:#0B0A08;}
.screen.off{opacity:0;pointer-events:none;transform:scale(.97);}
#app{position:fixed;inset:0;z-index:10;display:flex;transition:opacity .35s;}
#app.off{opacity:0;pointer-events:none;}
#rv{position:fixed;inset:0;z-index:15;display:flex;background:#0B0A08;}
#rv.off{display:none;}
#dm{position:fixed;inset:0;z-index:16;display:flex;flex-direction:column;background:#0B0A08;}
#dm.off{display:none;}

/* TOAST */
#toasts{position:fixed;bottom:24px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:88vw;}
.toast{background:#1C1710;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 14px;
  font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 32px rgba(0,0,0,.6);
  animation:slideUp .3s both;word-break:break-word;min-width:200px;}
.toast.ok{border-color:rgba(34,197,94,.35);color:#86efac;}
.toast.err{border-color:rgba(239,68,68,.35);color:#fca5a5;}
.toast.inf{border-color:rgba(212,175,55,.35);color:#E8D9A0;}

/* ADMIN DASHBOARD */
#admin-dashboard{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;background:#0B0A08;overflow-y:auto;}
#admin-dashboard.off{display:none;}
.admin-header{background:linear-gradient(90deg,rgba(212,175,55,.1),rgba(176,141,43,.05));
  padding:16px;border-bottom:1px solid rgba(212,175,55,.2);display:flex;align-items:center;justify-content:space-between;}
.admin-header h1{font-family:'Playfair Display',serif;font-size:22px;color:#D4AF37;}
.admin-close{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;
  padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:700;}
.admin-body{flex:1;overflow-y:auto;padding:20px;}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px;}
.stat-card{background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.2);border-radius:12px;
  padding:20px;text-align:center;}
.stat-card .number{font-family:'Playfair Display',serif;font-size:32px;color:#D4AF37;font-weight:700;}
.stat-card .label{color:#9C9282;font-size:13px;margin-top:8px;}
.admin-section{margin-bottom:28px;}
.admin-section h2{font-family:'Playfair Display',serif;color:#D4AF37;font-size:18px;margin-bottom:12px;}
.users-list{background:rgba(17,24,39,.5);border:1px solid rgba(212,175,55,.15);border-radius:10px;
  overflow-y:auto;max-height:300px;}
.user-item{padding:12px;border-bottom:1px solid rgba(212,175,55,.1);display:flex;align-items:center;gap:10px;}
.user-item:last-child{border-bottom:none;}
.user-avatar{width:32px;height:32px;border-radius:50%;background:rgba(212,175,55,.2);display:flex;
  align-items:center;justify-content:center;font-size:12px;color:#D4AF37;}
.user-info{flex:1;}
.user-info .name{color:#F5EFDD;font-weight:600;}
.user-info .email{color:#9C9282;font-size:12px;}
.admin-badge{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#86efac;
  padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;}

/* LOGO */
.logo-box{background:linear-gradient(145deg,#0E0B06,#1C170F);display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 30px rgba(212,175,55,.5),0 0 60px rgba(176,141,43,.2);}

/* SPLASH */
#splash{flex-direction:column;gap:26px;}
.splash-logo .logo-box{width:96px;height:96px;border-radius:22px;animation:zoomIn 1s cubic-bezier(.34,1.56,.64,1) both,floatY 3s 1s ease-in-out infinite;}
.splash-title{text-align:center;animation:fadeUp .8s .4s both;}
.splash-title h1{font-family:'Playfair Display',serif;font-size:clamp(26px,7vw,42px);font-weight:700;letter-spacing:.5px;
  background:linear-gradient(100deg,#F0D888,#D4AF37 50%,#8B6F1F);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.splash-title p{color:#9C9282;font-size:13px;margin-top:6px;letter-spacing:.8px;}
.splash-btn{animation:fadeUp .8s .9s both;}
.btn-glow{padding:14px 50px;border-radius:14px;font-size:16px;font-weight:700;border:none;cursor:pointer;
  background:linear-gradient(90deg,#D4AF37,#B08D2B);color:#F5EFDD;
  box-shadow:0 0 28px rgba(212,175,55,.4);transition:all .2s;min-width:160px;}
.btn-glow:hover{transform:scale(1.04);box-shadow:0 0 48px rgba(212,175,55,.65);}
.btn-glow:active{transform:scale(.97);}

/* AUTH */
#auth{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 16px;}
.auth-card{width:400px;max-width:100%;background:rgba(17,24,39,.95);border:1px solid rgba(255,255,255,.08);
  border-radius:20px;padding:clamp(22px,5vw,34px);backdrop-filter:blur(16px);
  box-shadow:0 24px 80px rgba(0,0,0,.65);animation:fadeUp .5s both;}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:20px;}
.auth-logo .logo-box{width:52px;height:52px;border-radius:13px;}
.auth-logo h2{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;color:#E8D9A0;}
.auth-logo p{color:#9C9282;font-size:13px;}
.tabs{display:flex;background:rgba(255,255,255,.05);border-radius:10px;padding:4px;margin-bottom:18px;}
.tab{flex:1;padding:8px;border:none;background:transparent;color:#9C9282;font-size:13px;font-weight:600;
  cursor:pointer;border-radius:7px;transition:all .2s;}
.tab.on{background:rgba(212,175,55,.15);color:#D4AF37;}
.field{position:relative;margin-bottom:11px;}
.field .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;color:#9C9282;pointer-events:none;}
.field input{width:100%;padding:12px 13px 12px 36px;border-radius:10px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.05);color:#F5EFDD;font-size:14px;outline:none;transition:border .2s;}
.field input:focus{border-color:rgba(212,175,55,.5);box-shadow:0 0 0 3px rgba(212,175,55,.08);}
.field input::placeholder{color:#9C9282;}
.forgot{text-align:right;margin-bottom:13px;}
.forgot a{color:#D4AF37;font-size:12px;cursor:pointer;}
.btn-main{width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;
  background:linear-gradient(90deg,#D4AF37,#B08D2B);color:#F5EFDD;font-size:15px;font-weight:700;
  box-shadow:0 0 16px rgba(212,175,55,.22);transition:all .2s;margin-bottom:15px;
  display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-main:active{transform:scale(.98);}
.btn-main:disabled{opacity:.6;pointer-events:none;}
.sep{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.sep span{color:#9C9282;font-size:12px;white-space:nowrap;}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08);}
.btn-google{width:100%;padding:11px;border-radius:10px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);color:#e5e7eb;font-size:14px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:all .2s;margin-bottom:14px;}
.btn-google:active{background:rgba(255,255,255,.1);}
.auth-foot{text-align:center;color:#9C9282;font-size:13px;}
.auth-foot a{color:#D4AF37;cursor:pointer;font-weight:600;}
.alert{padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:11px;display:none;line-height:1.4;}
.alert.show{display:block;}
.alert.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;}
.alert.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac;}
.alert.inf{background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.2);color:#E8D9A0;}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:#F5EFDD;
  border-radius:50%;animation:spinning .65s linear infinite;display:inline-block;}

/* SIDEBAR */
.sidebar{width:228px;height:100vh;background:rgba(6,10,22,1);border-right:1px solid rgba(255,255,255,.07);
  display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;z-index:30;
  transition:width .28s ease,transform .28s ease;}
.sidebar.slim{width:60px;}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:29;}
.sb-brand{padding:15px 12px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer;overflow:hidden;flex-shrink:0;}
.sb-brand .logo-box{width:34px;height:34px;border-radius:9px;flex-shrink:0;}
.sb-txt{overflow:hidden;white-space:nowrap;}
.sb-txt h3{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;letter-spacing:.3px;color:#E8D9A0;}
.sb-txt p{font-size:11px;color:#9C9282;margin-top:2px;}
.sb-nav{flex:1;overflow-y:auto;padding:8px 8px;border-bottom:1px solid rgba(255,255,255,.07);}
.nrow{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;cursor:pointer;
  font-size:13px;color:#D8D2C4;transition:all .2s;margin-bottom:4px;text-decoration:none;white-space:nowrap;}
.nrow:hover{background:rgba(255,255,255,.06);}
.nrow.on{background:rgba(212,175,55,.15);color:#D4AF37;}
.nrow .ico{font-size:16px;width:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nrow .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-add{padding:8px;margin-bottom:12px;}
.btn-add-room{width:100%;padding:9px 10px;border-radius:10px;border:1px solid rgba(212,175,55,.25);
  background:rgba(212,175,55,.08);color:#D4AF37;font-size:13px;font-weight:600;cursor:pointer;
  transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-add-room:hover{background:rgba(212,175,55,.15);}
.sb-usr{padding:12px 10px;margin-top:auto;background:rgba(255,255,255,.03);border-top:1px solid rgba(255,255,255,.07);
  border-radius:10px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:all .2s;}
.sb-usr:hover{background:rgba(255,255,255,.06);}
.sb-usr .av{width:32px;height:32px;border-radius:50%;background:rgba(212,175,55,.2);display:flex;
  align-items:center;justify-content:center;font-size:13px;flex-shrink:0;color:#D4AF37;}
.sb-usr .info{flex:1;overflow:hidden;}
.sb-usr .info strong{font-size:13px;color:#F5EFDD;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-usr .info small{font-size:11px;color:#9C9282;}
.sb-usr .menu{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#9C9282;flex-shrink:0;}
.sb-usr .menu:hover{background:rgba(255,255,255,.1);}

/* ROOM LIST */
.roomList{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 8px;}
.rempty{padding:30px 20px;text-align:center;color:#9C9282;font-size:13px;}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
  cursor:pointer;transition:all .2s;margin-bottom:4px;background:rgba(255,255,255,.03);
  border:1px solid transparent;}
.rrow:hover{background:rgba(255,255,255,.08);border-color:rgba(212,175,55,.15);}
.rrow.on{background:rgba(212,175,55,.12);border-color:rgba(212,175,55,.3);}
.rrow .rico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;}
.rrow .rinfo{flex:1;overflow:hidden;min-width:0;}
.rrow .rinfo strong{color:#F5EFDD;font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rrow .rinfo small{color:#9C9282;font-size:12px;margin-top:2px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pbp{font-size:10px;background:rgba(212,175,55,.15);color:#D4AF37;padding:3px 7px;border-radius:6px;flex-shrink:0;}

/* MAIN CONTENT */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.rhead{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid rgba(255,255,255,.07);
  background:linear-gradient(90deg,rgba(212,175,55,.06),transparent);flex-shrink:0;}
.rh-info{display:flex;align-items:center;gap:12px;}
.rh-avatar{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:18px;background:rgba(212,175,55,.15);}
.rh-txt h3{font-size:15px;color:#F5EFDD;font-weight:600;}
.rh-txt p{font-size:12px;color:#9C9282;margin-top:2px;}
.rh-menu{display:flex;align-items:center;gap:6px;}
.btn-icon{width:36px;height:36px;border-radius:8px;border:none;background:rgba(255,255,255,.05);
  color:#D8D2C4;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
  transition:all .2s;}
.btn-icon:hover{background:rgba(255,255,255,.12);}

/* CHAT AREA */
#p-chat{display:flex;flex-direction:column;flex:1;}
.chat-box{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;
  display:flex;flex-direction:column;gap:8px;}
.msg-row{display:flex;gap:8px;animation:slideUp .2s ease-out;position:relative;
  padding:8px;border-radius:8px;transition:background .2s;}
.msg-row:hover{background:rgba(255,255,255,.05);}
.msg-row.own{flex-direction:row-reverse;}
.msg-av{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:12px;background:rgba(212,175,55,.15);color:#D4AF37;flex-shrink:0;overflow:hidden;}
.msg-av img{width:100%;height:100%;object-fit:cover;}
.msg-bubble{max-width:65%;background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.15);
  border-radius:12px;padding:10px 12px;color:#D8D2C4;font-size:13px;line-height:1.4;word-wrap:break-word;
  overflow-wrap:break-word;position:relative;}
.msg-row.own .msg-bubble{background:rgba(212,175,55,.18);border-color:rgba(212,175,55,.3);}
.msg-time{font-size:11px;color:#9C9282;margin-top:4px;text-align:center;}
.msg-img{max-width:200px;border-radius:10px;margin:6px 0;cursor:pointer;}

/* FRIENDS LIST */
.friends-container{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;}
.fr-empty{text-align:center;color:#9C9282;padding:30px 20px;font-size:13px;}
.fr-item{display:flex;align-items:center;gap:12px;padding:12px;background:rgba(255,255,255,.03);
  border:1px solid rgba(212,175,55,.15);border-radius:10px;margin-bottom:8px;transition:all .2s;}
.fr-item:hover{background:rgba(255,255,255,.08);}
.fr-av{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:14px;background:rgba(212,175,55,.15);flex-shrink:0;}
.fr-av img{width:100%;height:100%;object-fit:cover;border-radius:10px;}
.fr-info{flex:1;}
.fr-info strong{color:#F5EFDD;font-size:14px;display:block;}
.fr-info small{color:#9C9282;font-size:12px;}
.fr-stat{font-size:11px;color:#9C9282;margin-top:3px;}

/* DM LIST */
.dm-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;
  transition:all .2s;margin-bottom:4px;background:transparent;}
.dm-row:hover{background:rgba(255,255,255,.06);}
.dm-row.on{background:rgba(212,175,55,.12);}
.dm-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;background:rgba(212,175,55,.15);flex-shrink:0;}
.dm-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.dm-info{flex:1;overflow:hidden;min-width:0;}
.dm-info strong{color:#F5EFDD;font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dm-info small{color:#9C9282;font-size:12px;margin-top:2px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* MODALS */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:center;justify-content:center;
  transition:opacity .3s;backdrop-filter:blur(4px);}
.ovl.off{opacity:0;pointer-events:none;}
.modal{background:var(--card);border:1px solid rgba(212,175,55,.2);border-radius:16px;
  padding:24px;width:90%;max-width:500px;max-height:85vh;overflow-y:auto;
  animation:slideUp .3s both;box-shadow:0 20px 60px rgba(0,0,0,.8);}
.modal h2{font-family:'Playfair Display',serif;color:#E8D9A0;font-size:20px;margin-bottom:16px;}

/* ANIMATIONS */
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes zoomIn{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
@keyframes floatY{0%,100%{transform:translateY(0px);}50%{transform:translateY(-8px);}}
@keyframes spinning{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

/* RESPONSIVE */
@media(max-width:760px){
  .sidebar{width:60px;transform:translateX(-100%);position:fixed;}
  .sidebar.open{transform:translateX(0);}
  .main{width:100%;}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<!-- SCREENS -->
<div class="screen" id="splash">
  <div class="splash-logo"><div class="logo-box">🌀</div></div>
  <div class="splash-title"><h1>Nexora</h1><p>Collaboration Studio</p></div>
  <div class="splash-btn"><button class="btn-glow" onclick="loadApp()">Get Started</button></div>
</div>

<div class="screen off" id="auth">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-box" style="width:50px;height:50px;">🌀</div>
      <h2>Nexora Studio</h2>
      <p>Collaboration & AI</p>
    </div>
    <div class="tabs">
      <button class="tab on" onclick="authTab('signin')">Sign In</button>
      <button class="tab" onclick="authTab('signup')">Sign Up</button>
    </div>
    <div id="aErr" class="alert"></div>
    <div id="signin-form">
      <div class="field"><span class="ico">✉️</span><input id="siEmail" type="email" placeholder="Email"></div>
      <div class="field"><span class="ico">🔐</span><input id="siPass" type="password" placeholder="Password"></div>
      <button class="btn-main" onclick="signIn()"><span class="spin" style="display:none;" id="siSpin"></span>Sign In</button>
      <div class="sep"><span>or</span></div>
      <button class="btn-google" onclick="signInGoogle()">🔵 Sign in with Google</button>
      <div class="auth-foot">New? <a onclick="authTab('signup')">Create account</a></div>
    </div>
    <div id="signup-form" style="display:none;">
      <div class="field"><span class="ico">✉️</span><input id="suEmail" type="email" placeholder="Email"></div>
      <div class="field"><span class="ico">🔐</span><input id="suPass" type="password" placeholder="Password"></div>
      <div class="field"><span class="ico">🔐</span><input id="suPass2" type="password" placeholder="Confirm Password"></div>
      <button class="btn-main" onclick="signUp()"><span class="spin" style="display:none;" id="suSpin"></span>Create Account</button>
      <div class="sep"><span>or</span></div>
      <button class="btn-google" onclick="signUpGoogle()">🔵 Sign up with Google</button>
      <div class="auth-foot">Have an account? <a onclick="authTab('signin')">Sign in</a></div>
    </div>
  </div>
</div>

<div id="app">
  <!-- SIDEBAR -->
  <div class="sidebar" id="sb">
    <div class="sb-brand" onclick="toggleSb()">
      <div class="logo-box" style="width:28px;height:28px;font-size:16px;">🌀</div>
      <div class="sb-txt">
        <h3>Nexora</h3>
        <p>Studio</p>
      </div>
    </div>
    <div class="sb-nav" id="sbNav"></div>
    <div class="sb-add">
      <button class="btn-add-room" onclick="openM('newroom')">+ New Room</button>
    </div>
    <div class="sb-usr" onclick="openM('profile')">
      <div class="av" id="uAv">N</div>
      <div class="info">
        <strong id="uName">Loading...</strong>
        <small id="uStat">Online</small>
      </div>
      <div class="menu" onclick="event.stopPropagation();openM('menu')">⋮</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main" id="main">
    <!-- ROOM VIEW -->
    <div id="rv">
      <div style="display:flex;flex-direction:column;flex:1;">
        <div class="rhead" id="rhead"></div>
        <div style="flex:1;display:flex;flex-direction:column;">
          <div class="chat-box" id="chatBox"></div>
          <div style="padding:16px;border-top:1px solid rgba(255,255,255,.07);background:rgba(6,10,22,.8);">
            <div style="display:flex;gap:8px;margin-bottom:8px;" id="vBar" class="vBar"></div>
            <div style="display:flex;gap:8px;">
              <input id="msgInput" type="text" placeholder="Type a message..." style="flex:1;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#F5EFDD;outline:none;">
              <button onclick="sendMsg()" style="padding:10px 14px;background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.3);border-radius:10px;color:#D4AF37;cursor:pointer;">Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- DM VIEW -->
    <div id="dm" style="display:none;">
      <div class="rhead" style="justify-content:space-between;">
        <div class="rh-info" id="dmHeader"></div>
        <div class="dm-header-actions" id="dmActions"></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;">
        <div class="chat-box" id="dmBox"></div>
        <div style="padding:16px;border-top:1px solid rgba(255,255,255,.07);background:rgba(6,10,22,.8);">
          <div style="display:flex;gap:8px;">
            <input id="dmInput" type="text" placeholder="Type a message..." style="flex:1;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#F5EFDD;outline:none;">
            <button onclick="sendDM()" style="padding:10px 14px;background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.3);border-radius:10px;color:#D4AF37;cursor:pointer;">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div id="toasts"></div>

<!-- CONFIRM MODAL -->
<div class="confirm-modal" id="confirmModal">
  <div class="confirm-box">
    <h3 id="confirmTitle">Confirm Action</h3>
    <p id="confirmMsg">Are you sure?</p>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="btn-confirm" onclick="confirmAction()">Delete</button>
    </div>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js"></script>

<script>
// ════════════════════ CONFIG ════════════════════
firebase.initializeApp({
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
});

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();
let user = null, room = null, userProfile = null;
let rooms = [], friends = [], dmConversations = {};

// ════════════════════ HELPERS ════════════════════
const $ = id => document.getElementById(id);
function toast(msg, type = 'inf') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = (type === 'ok' ? '✓ ' : type === 'err' ? '✕ ' : 'ⓘ ') + msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ════════════════════ DELETE FUNCTIONS ════════════════════

// 🗑️ حذف رسالة من الغرفة
async function deleteRoomMessage(messageId, roomId) {
  if (!user || !room) return;
  
  pendingDelete = { type: 'roomMsg', id: messageId, roomId: roomId };
  showConfirm(
    'Delete Message',
    'Are you sure you want to delete this message? This cannot be undone.',
    performDelete
  );
}

// 🗑️ حذف محادثة مع صديق
async function deleteDMConversation(friendId) {
  if (!user) return;
  
  pendingDelete = { type: 'dmConv', friendId: friendId };
  showConfirm(
    'Delete Conversation',
    `Delete all messages with this friend? This cannot be undone.`,
    performDelete
  );
}

// 🗑️ حذف الصداقة
async function removeFriend(friendId) {
  if (!user) return;
  
  pendingDelete = { type: 'friend', friendId: friendId };
  showConfirm(
    'Remove Friend',
    'Remove this friend? You will not be able to message them.',
    performDelete
  );
}

// Confirm Modal Functions
let pendingDelete = null;

function showConfirm(title, msg, callback) {
  $('confirmTitle').textContent = title;
  $('confirmMsg').textContent = msg;
  $('confirmModal').classList.add('show');
}

function closeConfirm() {
  $('confirmModal').classList.remove('show');
  pendingDelete = null;
}

async function confirmAction() {
  if (!pendingDelete) return;
  
  try {
    if (pendingDelete.type === 'roomMsg') {
      await db.collection('rooms').doc(pendingDelete.roomId)
        .collection('messages').doc(pendingDelete.id).delete();
      toast('Message deleted', 'ok');
      loadRoomMessages(room.id);
    }
    
    else if (pendingDelete.type === 'dmConv') {
      // حذف جميع الرسائل المباشرة
      const convId = user.uid < pendingDelete.friendId ? 
        user.uid + '_' + pendingDelete.friendId : 
        pendingDelete.friendId + '_' + user.uid;
      
      const msgs = await db.collection('directMessages').doc(convId).collection('messages').get();
      const batch = db.batch();
      msgs.forEach(doc => batch.delete(doc.ref));
      await batch.commit();
      
      await db.collection('directMessages').doc(convId).delete();
      toast('Conversation deleted', 'ok');
      
      // إغلق نافذة DM
      $('dm').classList.add('off');
    }
    
    else if (pendingDelete.type === 'friend') {
      // حذف من friends collection للمستخدم الحالي
      await db.collection('users').doc(user.uid)
        .collection('friends').doc(pendingDelete.friendId).delete();
      
      // حذف من friends collection للصديق
      await db.collection('users').doc(pendingDelete.friendId)
        .collection('friends').doc(user.uid).delete();
      
      toast('Friend removed', 'ok');
      loadFriends();
    }
  } catch (err) {
    console.error('Delete error:', err);
    toast('Error: ' + err.message, 'err');
  }
  
  closeConfirm();
}

// ════════════════════ AUTH ════════════════════
function authTab(tab) {
  $('signin-form').style.display = tab === 'signin' ? 'block' : 'none';
  $('signup-form').style.display = tab === 'signup' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('on', (i === 0 && tab === 'signin') || (i === 1 && tab === 'signup'));
  });
}

async function signIn() {
  const email = $('siEmail').value.trim();
  const pass = $('siPass').value;
  if (!email || !pass) return alert('Enter email and password');
  
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

async function signUp() {
  const email = $('suEmail').value.trim();
  const pass = $('suPass').value;
  const pass2 = $('suPass2').value;
  if (!email || !pass || pass !== pass2) return alert('Check your inputs');
  
  try {
    await auth.createUserWithEmailAndPassword(email, pass);
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

async function signInGoogle() {
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
  } catch (err) {
    alert('Google sign-in failed: ' + err.message);
  }
}

async function signUpGoogle() {
  signInGoogle();
}

auth.onAuthStateChanged(async (u) => {
  user = u;
  if (user) {
    $('splash').classList.add('off');
    $('auth').classList.add('off');
    $('app').classList.remove('off');
    loadApp();
  } else {
    $('splash').classList.remove('off');
    $('auth').classList.add('off');
    $('app').classList.add('off');
  }
});

// ════════════════════ MAIN APP ════════════════════
async function loadApp() {
  if (!user) {
    $('splash').classList.remove('off');
    $('auth').classList.remove('off');
    return;
  }
  
  // Load user profile
  const uDoc = await db.collection('users').doc(user.uid).get();
  userProfile = uDoc.exists ? uDoc.data() : {
    name: user.displayName || 'User',
    username: user.email.split('@')[0],
    bio: '',
    photoData: null
  };
  
  $('uName').textContent = userProfile.name || user.email;
  
  // Load rooms
  loadRooms();
  loadFriends();
}

async function loadRooms() {
  try {
    const snap = await db.collection('rooms').where('members', 'array-contains', user.uid).get();
    rooms = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderRooms();
  } catch (err) {
    console.error('Load rooms error:', err);
  }
}

function renderRooms() {
  const nav = $('sbNav');
  nav.innerHTML = rooms.map(r => `
    <div class="nrow ${room && room.id === r.id ? 'on' : ''}" onclick="openRoom('${r.id}')">
      <div class="ico">${r.emoji || '🎯'}</div>
      <div class="lbl">${r.name}</div>
    </div>
  `).join('') + `
    <div class="nrow" onclick="loadFriends();navTo(event.currentTarget)">
      <div class="ico">👥</div>
      <div class="lbl">Friends</div>
    </div>
  `;
}

async function openRoom(roomId) {
  try {
    const rDoc = await db.collection('rooms').doc(roomId).get();
    if (!rDoc.exists) return;
    
    room = { id: roomId, ...rDoc.data() };
    $('rv').style.display = 'flex';
    $('dm').classList.add('off');
    
    // Header
    $('rhead').innerHTML = `
      <div class="rh-info">
        <div class="rh-avatar">${room.emoji || '🎯'}</div>
        <div class="rh-txt">
          <h3>${room.name}</h3>
          <p>${room.members.length} member(s)</p>
        </div>
      </div>
    `;
    
    loadRoomMessages(roomId);
    
    // Listen for new messages
    db.collection('rooms').doc(roomId).collection('messages')
      .orderBy('timestamp').limit(50)
      .onSnapshot(snap => {
        loadRoomMessages(roomId);
      });
  } catch (err) {
    console.error('Open room error:', err);
  }
}

async function loadRoomMessages(roomId) {
  try {
    const snap = await db.collection('rooms').doc(roomId).collection('messages')
      .orderBy('timestamp').limit(100).get();
    
    const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    $('chatBox').innerHTML = msgs.map(m => `
      <div class="msg-row ${m.uid === user.uid ? 'own' : ''}">
        <div class="msg-av">${m.name ? m.name[0].toUpperCase() : 'U'}</div>
        <div style="position:relative;flex:1;">
          <div class="msg-bubble">
            ${m.img ? `<img src="${m.img}" class="msg-img" onclick="window.open('${m.img}')">` : ''}
            ${m.text || ''}
            <div class="msg-actions" ${m.uid === user.uid ? '' : 'style="display:none"'}>
              <button class="btn-del" onclick="deleteRoomMessage('${m.id}', '${roomId}')" title="Delete message">🗑️</button>
            </div>
          </div>
          <div class="msg-time">${new Date(m.timestamp).toLocaleTimeString()}</div>
        </div>
      </div>
    `).join('');
    
    $('chatBox').scrollTop = $('chatBox').scrollHeight;
  } catch (err) {
    console.error('Load messages error:', err);
  }
}

async function sendMsg() {
  const text = $('msgInput').value.trim();
  if (!text || !room) return;
  
  $('msgInput').value = '';
  
  try {
    await db.collection('rooms').doc(room.id).collection('messages').add({
      uid: user.uid,
      name: userProfile.name,
      text: text,
      timestamp: new Date(),
      reactions: {}
    });
  } catch (err) {
    toast('Error sending message', 'err');
  }
}

// ════════════════════ FRIENDS & DM ════════════════════
async function loadFriends() {
  try {
    const snap = await db.collection('users').doc(user.uid).collection('friends').get();
    friends = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    
    renderFriends();
  } catch (err) {
    console.error('Load friends error:', err);
  }
}

function renderFriends() {
  const nav = $('sbNav');
  nav.innerHTML = `<div class="nrow" onclick="loadFriends();navTo(event.currentTarget)"><div class="ico">👥</div><div class="lbl">Friends</div></div>`;
  
  const main = $('main');
  main.innerHTML = `
    <div style="padding:20px;overflow-y:auto;">
      <h2 style="font-family:'Playfair Display',serif;color:#E8D9A0;margin-bottom:16px;">Friends (${friends.length})</h2>
      <div class="friends-container">
        ${friends.length === 0 ? '<div class="fr-empty">No friends yet</div>' : ''}
        ${friends.map(f => `
          <div class="fr-item">
            <div class="fr-av">${f.name ? f.name[0].toUpperCase() : 'U'}</div>
            <div class="fr-info">
              <strong>${f.name || 'Friend'}</strong>
              <small>@${f.username || 'user'}</small>
              <div class="fr-stat">${f.online ? '🟢 Online' : '⚫ Offline'}</div>
            </div>
            <div class="friend-actions">
              <button class="btn-unfriend" onclick="openDM('${f.id}', '${f.name}')">💬 Message</button>
              <button class="btn-unfriend" style="background:rgba(239,68,68,.12);color:#fca5a5;" onclick="removeFriend('${f.id}')">✕ Remove</button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

async function openDM(friendId, friendName) {
  const convId = user.uid < friendId ? user.uid + '_' + friendId : friendId + '_' + user.uid;
  
  $('dm').classList.remove('off');
  $('rv').style.display = 'none';
  
  $('dmHeader').innerHTML = `
    <div class="rh-avatar">${friendName[0].toUpperCase()}</div>
    <div class="rh-txt">
      <h3>${friendName}</h3>
      <p>Direct Message</p>
    </div>
  `;
  
  $('dmActions').innerHTML = `
    <button class="btn-del-dm" onclick="deleteDMConversation('${friendId}')">🗑️ Delete Chat</button>
  `;
  
  loadDMMessages(convId, friendId);
}

async function loadDMMessages(convId, friendId) {
  try {
    const snap = await db.collection('directMessages').doc(convId).collection('messages')
      .orderBy('timestamp').limit(100).get();
    
    const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    $('dmBox').innerHTML = msgs.map(m => `
      <div class="msg-row ${m.uid === user.uid ? 'own' : ''}">
        <div class="msg-av">${m.senderName ? m.senderName[0].toUpperCase() : 'U'}</div>
        <div class="msg-bubble">${m.text || ''}</div>
      </div>
    `).join('');
    
    $('dmBox').scrollTop = $('dmBox').scrollHeight;
  } catch (err) {
    console.error('Load DM error:', err);
  }
}

async function sendDM() {
  const text = $('dmInput').value.trim();
  if (!text || !friends.length) return;
  
  $('dmInput').value = '';
  
  const friendId = friends[0].id;
  const convId = user.uid < friendId ? user.uid + '_' + friendId : friendId + '_' + user.uid;
  
  try {
    await db.collection('directMessages').doc(convId).collection('messages').add({
      uid: user.uid,
      senderName: userProfile.name,
      text: text,
      timestamp: new Date()
    });
  } catch (err) {
    toast('Error sending message', 'err');
  }
}

// ════════════════════ INIT ════════════════════
function toggleSb(){$('sb').classList.toggle('slim');}
function navTo(el){document.querySelectorAll('.nrow').forEach(n=>n.classList.remove('on'));el.classList.add('on');}
</script>
</body>
</html>
