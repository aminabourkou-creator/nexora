<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA - Chat Platform</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <canvas id="bg"></canvas>

  <!-- ════════════════════════════════════════ -->
  <!-- AUTH SCREEN -->
  <!-- ════════════════════════════════════════ -->
  <div id="auth" class="screen">
    <div class="splash"></div>
    
    <div class="auth-card">
      <div class="logo">🌙 NEXORA</div>
      
      <div class="tabs">
        <button class="tab-btn on" onclick="switchTab('in')">Sign In</button>
        <button class="tab-btn" onclick="switchTab('up')">Sign Up</button>
      </div>

      <div class="form">
        <input id="emailI" type="email" placeholder="Email">
        <input id="passI" type="password" placeholder="Password">
        <input id="nameI" type="text" placeholder="Full Name (for sign up only)">
        
        <button id="aBtn" onclick="doAuth()" class="btn-primary">Sign In</button>
        <button onclick="doGoogle()" class="btn-secondary">🔐 Google</button>
        <button onclick="forgotPw()" class="btn-link">Forgot Password?</button>
        
        <div id="aErr" style="display:none;color:#ff6b6b;margin-top:12px;font-size:12px;"></div>
        <div id="aOk" style="display:none;color:#51cf66;margin-top:12px;font-size:12px;"></div>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════ -->
  <!-- MAIN APP -->
  <!-- ════════════════════════════════════════ -->
  <div id="app" class="screen" style="display:none">
    <div class="sidebar">
      <div class="sb-header">
        <div id="sbAv" class="av"></div>
        <div class="sb-user">
          <div id="sbName" class="name">User</div>
          <div id="sbEmail" class="email">email</div>
        </div>
        <button onclick="toggleSb()" class="btn-close">✕</button>
      </div>

      <nav class="sb-nav">
        <button onclick="navTo('rooms')" class="nav-btn">💬 Rooms</button>
        <button onclick="navTo('friends')" class="nav-btn">👥 Friends</button>
        <button onclick="navTo('profile')" class="nav-btn">👤 Profile</button>
        <button onclick="navTo('voice')" class="nav-btn">🎤 Voice</button>
        <button onclick="doLogout()" class="nav-btn logout">🚪 Logout</button>
      </nav>
    </div>

    <div class="main">
      <div class="top-bar">
        <button onclick="toggleSb()" class="btn-menu">☰</button>
        <div id="topName" class="name">NEXORA</div>
        <div id="topAv" class="av">N</div>
      </div>

      <!-- ════ ROOMS TAB ════ -->
      <div id="rooms-panel" class="panel active">
        <div class="rooms-header">
          <h2>🌙 Rooms</h2>
          <button onclick="openM('newRoom')" class="btn-primary">+ New</button>
        </div>
        
        <div id="roomsList" class="rooms-list"></div>
      </div>

      <!-- ════ ROOM CHAT ════ -->
      <div id="room-chat-panel" class="panel" style="display:none">
        <div class="room-header">
          <button onclick="backDash()" class="btn-back">← Back</button>
          <h2 id="roomName">Room</h2>
          <!-- ✅ زر مسح شات الغرفة -->
          <button onclick="clearRoomChat()" class="btn-clear" title="Clear all room messages">
            🗑️ Clear Chat
          </button>
        </div>

        <div id="chatContainer" class="chat-box"></div>

        <div class="chat-input">
          <input id="msgInput" type="text" placeholder="Type a message...">
          <button onclick="sendMsg()" class="btn-send">Send</button>
        </div>
      </div>

      <!-- ════ FRIENDS TAB ════ -->
      <div id="friends-panel" class="panel" style="display:none">
        <div class="friends-header">
          <h2>👥 Friends</h2>
        </div>

        <div class="friends-tabs">
          <button id="tab-list" class="tab-btn on" onclick="switchFriendsTab('list')">List</button>
          <button id="tab-requests" class="tab-btn" onclick="switchFriendsTab('requests')">
            Requests
            <span id="friendReqBadge" class="badge" style="display:none">0</span>
          </button>
          <button id="tab-search" class="tab-btn" onclick="switchFriendsTab('search')">Search</button>
        </div>

        <!-- Friends List -->
        <div id="friends-list-panel">
          <div id="friendsList" class="friends-list"></div>
        </div>

        <!-- Requests -->
        <div id="friends-requests-panel" style="display:none">
          <div id="friendRequests" class="friend-requests"></div>
        </div>

        <!-- Search -->
        <div id="friends-search-panel" style="display:none">
          <div class="search-box">
            <input id="searchFriendInput" type="text" placeholder="Search users..."
              onkeyup="searchFriends(this.value)">
          </div>
          <div id="searchResults" class="search-results"></div>
        </div>
      </div>

      <!-- ════ DM PANEL ════ -->
      <div id="dm-panel" class="panel" style="display:none">
        <div class="dm-header">
          <button onclick="backDash()" class="btn-back">← Back</button>
          <h2 id="dmFriendName">Friend</h2>
          <!-- ✅ زر مسح رسائل الخاص -->
          <button onclick="clearDMChat(currentFriendId)" class="btn-clear" title="Clear all private messages">
            🗑️ Clear Messages
          </button>
        </div>

        <div id="dmContainer" class="dm-box"></div>

        <div class="dm-input">
          <input id="dmInput" type="text" placeholder="Type a message...">
          <button onclick="sendDM(currentFriendId, currentFriendName)" class="btn-send">Send</button>
        </div>
      </div>

      <!-- ════ PROFILE TAB ════ -->
      <div id="profile-panel" class="panel" style="display:none">
        <div class="profile-card">
          <div id="rvAv" class="av"></div>
          <div id="pName" class="name">User</div>
          <div id="pEmail" class="email">email</div>
          <div id="wMsg" class="welcome">Welcome!</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════ -->
  <!-- JOIN ROOM SCREEN -->
  <!-- ════════════════════════════════════════ -->
  <div id="join" class="screen" style="display:none">
    <div class="join-card">
      <h2>Join Room</h2>
      <p>You're invited! Click below to join.</p>
      <button onclick="joinRoom()" class="btn-primary">Accept Invite</button>
      <button onclick="cancelJoin()" class="btn-secondary">Decline</button>
    </div>
  </div>

  <!-- ════════════════════════════════════════ -->
  <!-- MODALS -->
  <!-- ════════════════════════════════════════ -->

  <!-- New Room Modal -->
  <div id="newRoom" class="modal" style="display:none">
    <div class="modal-content">
      <h2>Create Room</h2>
      <input id="roomNameI" type="text" placeholder="Room Name">
      <div class="modal-actions">
        <button onclick="createRoom()" class="btn-primary">Create</button>
        <button onclick="closeM('newRoom')" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Emoji Picker Modal -->
  <div id="emojiM" class="modal" style="display:none">
    <div class="modal-content">
      <h2>Pick Emoji</h2>
      <div id="emojiGrid" class="emoji-grid"></div>
      <button onclick="closeM('emojiM')" class="btn-secondary">Close</button>
    </div>
  </div>

  <!-- ════════════════════════════════════════ -->
  <!-- SCRIPTS -->
  <!-- ════════════════════════════════════════ -->
  <script type="module" src="./app.js"></script>
</body>
</html>

<style>
/* ════════════════════════════════════════ */
/* GLOBAL STYLES */
/* ════════════════════════════════════════ */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #d4af37;
  --dark: #1a1a1a;
  --darker: #0f0f0f;
  --text: #e0e0e0;
  --text-muted: #9C9282;
  --border: #333;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: 'Manrope', sans-serif;
  background: var(--darker);
  color: var(--text);
  overflow: hidden;
}

/* ════════════════════════════════════════ */
/* BUTTONS - CLEAR BUTTONS */
/* ════════════════════════════════════════ */

.btn-clear {
  background: rgba(255, 100, 100, 0.1);
  color: #ff6b6b;
  border: 1px solid rgba(255, 100, 100, 0.3);
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.3s ease;
  font-weight: 500;
}

.btn-clear:hover {
  background: rgba(255, 100, 100, 0.2);
  border-color: #ff6b6b;
  transform: scale(1.05);
}

.btn-clear:active {
  transform: scale(0.95);
}

/* ════════════════════════════════════════ */
/* OTHER BUTTONS */
/* ════════════════════════════════════════ */

.btn-primary, .btn-secondary, .btn-link, .btn-back, .btn-send, .btn-close, .btn-menu {
  border: none;
  border-radius: 6px;
  padding: 10px 16px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.3s ease;
  font-size: 14px;
}

.btn-primary {
  background: var(--primary);
  color: var(--dark);
}

.btn-primary:hover {
  opacity: 0.8;
}

.btn-secondary {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.05);
}

.btn-link {
  background: transparent;
  color: var(--primary);
}

.btn-back {
  background: transparent;
  color: var(--text);
  padding: 8px;
}

.btn-send {
  background: var(--primary);
  color: var(--dark);
  padding: 8px 12px;
}

/* ════════════════════════════════════════ */
/* LAYOUT */
/* ════════════════════════════════════════ */

.screen {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  z-index: 1;
}

#app {
  display: flex !important;
  flex-direction: row;
}

.sidebar {
  width: 280px;
  background: var(--dark);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 16px;
  overflow-y: auto;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.panel {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: none;
}

.panel.active {
  display: block;
}

/* ════════════════════════════════════════ */
/* HEADERS */
/* ════════════════════════════════════════ */

.room-header, .dm-header, .rooms-header, .friends-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 10px;
}

.room-header h2, .dm-header h2, .rooms-header h2, .friends-header h2 {
  font-size: 20px;
}

/* ════════════════════════════════════════ */
/* CHAT BOXES */
/* ════════════════════════════════════════ */

.chat-box, .dm-box {
  flex: 1;
  overflow-y: auto;
  margin-bottom: 16px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.3);
}

.msg, .dm {
  margin-bottom: 12px;
  padding: 10px;
  border-radius: 6px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.msg.own, .dm.own {
  background: rgba(212, 175, 55, 0.1);
  justify-content: flex-end;
}

.msg.other, .dm.other {
  background: rgba(100, 100, 100, 0.1);
}

.msg .content, .dm .content {
  max-width: 70%;
}

.msg p, .dm p {
  word-wrap: break-word;
}

/* ════════════════════════════════════════ */
/* INPUT AREAS */
/* ════════════════════════════════════════ */

.chat-input, .dm-input {
  display: flex;
  gap: 8px;
}

.chat-input input, .dm-input input {
  flex: 1;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px;
  border-radius: 6px;
}

.chat-input input::placeholder, .dm-input input::placeholder {
  color: var(--text-muted);
}

/* ════════════════════════════════════════ */
/* RESPONSIVE */
/* ════════════════════════════════════════ */

@media (max-width: 768px) {
  .sidebar {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 10;
    transform: translateX(-100%);
    transition: transform 0.3s;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .btn-clear {
    padding: 6px 10px;
    font-size: 12px;
  }
}
</style>
